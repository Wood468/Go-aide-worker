configuration:
  job_action:
    name: Job to run
    description: "Idle does nothing. Queue Scan is read-only; Queue Loop polls approved issues every ten minutes when enabled. Refresh securely replaces the old isolated public checkout with latest main. Probe tests Gemini API. Direct Edit uses Gemini to change one selected text file without Aider or shell commands. Verify checks the Gemini smoke-test file. Publish Test creates then closes a temporary draft PR and deletes its branch. Publish submits up to ten allowed files to a new draft PR and is disabled by default."
  edit_files:
    name: Files to edit (comma-separated)
    description: "Required allowlist for queue jobs: up to five safe paths. Queue Loop accepts existing flat test/*.test.mjs files only. Queue Once can also use reviewed source/test/cache paths. Manual edits use these paths as model context."
  job_prompt:
    name: Coding task prompt
    description: "Required only for Edit. Do not paste keys, tokens or other secrets."
  enable_queue:
    name: Enable approved task queue
    description: "Off by default. With Queue Loop, edits one approved documentation task at a time and submits a draft PR. Requires both editing and publishing explicitly enabled."
  enable_publishing:
    name: Allow draft PR publishing
    description: "Off by default. Requires a GitHub token, permits new worker branch plus draft PR only, never merge."
  enable_edits:
    name: Allow Aider to edit files
    description: "Off by default. Only permits edits inside the worker's isolated repository checkout."
  gemini_api_key:
    name: Google AI Studio API key
    description: "Keep this key here in Home Assistant, not in GitHub or ChatGPT. Only an explicitly enabled Edit job passes it to Aider."
  github_token:
    name: GitHub fine-grained token
    description: "Restricted to Wood468/crispy-barnacle. Stored here, never sent to Gemini or tests. Only passed to the explicitly enabled Publish action."
