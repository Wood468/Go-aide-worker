name: "GO Aider Worker (Prototype)"
version: "0.5.22"
slug: "go_aider_worker"
description: "Isolated, one-job-at-a-time Gemini/Aider worker; experimental"
url: "https://github.com/Wood468/Go-aide-worker"
arch:
  - amd64
startup: application
boot: auto
init: false
hassio_api: false
homeassistant_api: false
docker_api: false
host_network: false
privileged: []
full_access: false
apparmor: true
map: []
options:
  job_action: idle
  job_prompt: ""
  edit_files: ""
  enable_edits: false
  enable_publishing: false
  enable_queue: false
  gemini_api_key: ""
  github_token: ""
schema:
  job_action: "list(idle|prepare|refresh|inspect|test|edit|direct_edit|verify|publish|publish_test|probe|queue_scan|queue_once|queue_loop|queue_status|queue_recover_pilot|queue_recover_code_pilot|queue_ack_code_pilot|queue_recover_artwork_task|queue_retire_artwork_task|queue_retire_two_file_pilot|queue_retire_venue_clock_task|queue_retire_four_file_pilot|queue_retire_banner_cache_task|queue_retire_two_file_service_task|queue_retire_places_publish_task|queue_retire_rotation_service_task)"
  job_prompt: str
  edit_files: str
  enable_edits: bool
  enable_publishing: bool
  enable_queue: bool
  gemini_api_key: password
  github_token: password
