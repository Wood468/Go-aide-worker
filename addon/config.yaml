name: "GO Aider Worker (Prototype)"
version: "0.3.0"
slug: "go_aider_worker"
description: "Isolated, one-job-at-a-time Gemini/Aider worker; experimental"
url: "https://github.com/Wood468/Go-aide-worker"
arch:
  - amd64
startup: application
boot: manual
init: false
hassio_api: false
homeassistant_api: false
docker_api: false
host_network: false
privileged: []
full_access: false
apparmor: true
map: []
options:
  job_action: idle
  job_prompt: ""
  enable_edits: false
  enable_publishing: false
  gemini_api_key: ""
  github_token: ""
schema:
  job_action: "list(idle|prepare|inspect|test|edit|verify|publish)"
  job_prompt: str
  enable_edits: bool
  enable_publishing: bool
  gemini_api_key: password
  github_token: password
